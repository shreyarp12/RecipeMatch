{% extends 'base.html' %}
{% block content %}
<div class="form-card text-center">
    <h2>Welcome Back!</h2>
    <form method="POST" style="margin-top: 20px; text-align: left;">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary w-100">Login</button>
    </form>
    <p class="mt-2">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
</div>
{% endblock %}
